# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install application dependencies
        run: npm ci && npm --prefix functions ci
      - name: Install Firebase emulator tooling
        run: npm install --global firebase-tools@15.8.0
      - name: Verify lint, unit tests, production build, and dependency audits
        run: npm run verify
      - name: Verify Firestore access rules
        run: npm run test:rules -- --project checkpoint-rules-test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BESPOKEBEHAVIORS }}
          channelId: live
          projectId: bespokebehaviors
